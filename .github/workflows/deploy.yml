name: Deploy OpenAlgo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"

permissions:
  id-token: write
  contents: read

concurrency:
  group: openalgo-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "590671674143"
  ECR_REPOSITORY: openalgo
  TF_VAR_key_pair_name: openalgo

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # One image, built from this repository, runs both OpenAlgo and the
      # strategy. The GitHub Actions cache keeps rebuilds to a few minutes.
      - name: Build and push OpenAlgo image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infra
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: infra
        run: terraform apply -auto-approve -input=false

      - name: Get EC2 IP
        id: ec2
        working-directory: infra
        env:
          OPENALGO_DOMAIN: ${{ vars.OPENALGO_DOMAIN }}
        run: |
          IP=$(terraform output -raw elastic_ip)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"
          # Brokers such as Upstox only accept an https redirect, which needs a
          # hostname for the certificate. Without OPENALGO_DOMAIN set, sslip.io
          # resolves <a-b-c-d>.sslip.io to the Elastic IP with no DNS setup.
          DOMAIN="${OPENALGO_DOMAIN:-${IP//./-}.sslip.io}"
          echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/openalgo.pem
          chmod 600 ~/.ssh/openalgo.pem

      - name: Allow temporary GitHub runner SSH access
        id: ssh_access
        env:
          EC2_IP: ${{ steps.ec2.outputs.ip }}
        run: |
          SG_ID=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=${EC2_IP}" \
            --query "Reservations[0].Instances[0].SecurityGroups[0].GroupId" \
            --output text)

          RUNNER_IP=$(curl -fsSL https://checkip.amazonaws.com/)

          echo "sg_id=$SG_ID" >> "$GITHUB_OUTPUT"
          echo "runner_cidr=$RUNNER_IP/32" >> "$GITHUB_OUTPUT"

          aws ec2 authorize-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_IP/32" || true

      - name: Deploy OpenAlgo to EC2
        env:
          EC2_IP: ${{ steps.ec2.outputs.ip }}
          DOMAIN: ${{ steps.ec2.outputs.domain }}
        run: |
          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          SSH="ssh -i $HOME/.ssh/openalgo.pem -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 ec2-user@$EC2_IP"

          # A fresh instance needs a few minutes for user_data to install Docker.
          for i in $(seq 1 40); do
            if $SSH "docker info >/dev/null 2>&1 && docker compose version >/dev/null 2>&1"; then
              break
            fi

            if [ "$i" -eq 40 ]; then
              echo "EC2 SSH or Docker is not ready"
              exit 1
            fi

            sleep 10
          done

          IMAGE="$REGISTRY/$ECR_REPOSITORY:sha-$GITHUB_SHA"

          $SSH "AWS_REGION='$AWS_REGION' REGISTRY='$REGISTRY' IMAGE='$IMAGE' DOMAIN='$DOMAIN' bash -s" <<'REMOTE'
          set -euo pipefail

          mkdir -p /home/ec2-user/openalgo
          cd /home/ec2-user/openalgo

          aws s3 cp --quiet \
            s3://us-east-1-openalgo/openalgo/openalgo.env \
            openalgo.env

          # The stored file targets a local install. Inside Docker, Flask and
          # the WebSocket proxy must listen on all interfaces, and every URL
          # the browser or the broker callback uses must be the public https
          # address that Caddy serves.
          set_env() {
            if grep -qE "^$1[[:space:]]*=" openalgo.env; then
              sed -i -E "s|^$1[[:space:]]*=.*|$1 = '$2'|" openalgo.env
            else
              echo "$1 = '$2'" >> openalgo.env
            fi
          }
          set_env FLASK_HOST_IP 0.0.0.0
          set_env WEBSOCKET_HOST 0.0.0.0
          set_env HOST_SERVER "https://$DOMAIN"
          set_env WEBSOCKET_URL "wss://$DOMAIN/ws"
          set_env CORS_ALLOWED_ORIGINS "https://$DOMAIN"
          set_env FLASK_ENV production
          sed -i -E "s|^(REDIRECT_URL[[:space:]]*=[[:space:]]*')https?://[^/]+|\1https://$DOMAIN|" openalgo.env

          # The container runs as UID 1000 and may write FERNET_SALT back.
          chmod 600 openalgo.env
          sudo chown 1000:1000 openalgo.env

          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$REGISTRY"

          # Caddy terminates TLS and renews the certificate on its own. The
          # WebSocket proxy is reached at /ws, as in the nginx installs.
          cat > Caddyfile <<EOF
          $DOMAIN {
            encode gzip
            handle /ws* {
              reverse_proxy openalgo:8765
            }
            handle {
              reverse_proxy openalgo:5000
            }
          }
          EOF

          cat > docker-compose.yml <<EOF
          services:
            caddy:
              image: caddy:2
              container_name: caddy
              restart: unless-stopped
              depends_on:
                - openalgo
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ./Caddyfile:/etc/caddy/Caddyfile:ro
                - caddy_data:/data
                - caddy_config:/config
              logging:
                driver: json-file
                options:
                  max-size: "10m"
                  max-file: "3"

            openalgo:
              image: $IMAGE
              container_name: openalgo
              restart: unless-stopped
              # 5000 is public (plain http); 8765 stays on the instance.
              ports:
                - "5000:5000"
                - "127.0.0.1:8765:8765"
              shm_size: 256m
              environment:
                - STRATEGY_MEMORY_LIMIT_MB=256
              volumes:
                - ./openalgo.env:/app/.env
                - openalgo_db:/app/db
                - openalgo_log:/app/log
                - openalgo_strategies:/app/strategies
                - openalgo_keys:/app/keys
                - openalgo_tmp:/app/tmp
              logging:
                driver: json-file
                options:
                  max-size: "20m"
                  max-file: "3"

          volumes:
            openalgo_db:
            openalgo_log:
            openalgo_strategies:
            openalgo_keys:
            openalgo_tmp:
            caddy_data:
            caddy_config:
          EOF

          docker compose pull
          docker compose up -d --remove-orphans
          docker image prune -f

          up=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:5000/auth/check-setup; then
              up=1
              break
            fi
            sleep 10
          done
          if [ "$up" -ne 1 ]; then
            echo "OpenAlgo did not answer within 5 minutes. Last log lines:"
            docker compose logs --tail 100 openalgo
            exit 1
          fi

          # The first certificate takes a few seconds to issue.
          for i in $(seq 1 18); do
            if curl -fsS -o /dev/null "https://$DOMAIN/auth/check-setup"; then
              echo "OpenAlgo is up at https://$DOMAIN"
              exit 0
            fi
            sleep 10
          done

          echo "OpenAlgo runs, but https://$DOMAIN did not answer within 3 minutes. Caddy log:"
          docker compose logs --tail 60 caddy
          exit 1
          REMOTE

      - name: Run strategy once
        env:
          EC2_IP: ${{ steps.ec2.outputs.ip }}
          DOMAIN: ${{ steps.ec2.outputs.domain }}
          OPENALGO_API_KEY: ${{ secrets.OPENALGO_API_KEY }}
          STRATEGY_HISTORY_SOURCE: ${{ vars.STRATEGY_HISTORY_SOURCE || 'api' }}
        run: |
          if [ -z "$OPENALGO_API_KEY" ]; then
            echo "::notice::Strategy skipped: set the OPENALGO_API_KEY secret (generated at https://$DOMAIN/apikey) and re-run this workflow."
            exit 0
          fi

          REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          SSH="ssh -i $HOME/.ssh/openalgo.pem -o StrictHostKeyChecking=accept-new ec2-user@$EC2_IP"

          # The key goes over stdin into a 600 file, never on a command line.
          printf 'OPENALGO_API_KEY=%s\nSTRATEGY_HISTORY_SOURCE=%s\nHOST_SERVER=http://openalgo:5000\n' \
            "$OPENALGO_API_KEY" "$STRATEGY_HISTORY_SOURCE" |
            $SSH "umask 077; cat > /home/ec2-user/openalgo/strategy.env"

          # Same image as OpenAlgo, started with the strategy as its command.
          # No volumes, so it always runs the code from this commit.
          $SSH "docker run --rm --name strategy \
            --network openalgo_default \
            --env-file /home/ec2-user/openalgo/strategy.env \
            $REGISTRY/$ECR_REPOSITORY:sha-$GITHUB_SHA \
            python -m utils.sampleStrategy_31302026"

      - name: Remove temporary SSH access
        if: always() && steps.ssh_access.outputs.sg_id != ''
        env:
          SG_ID: ${{ steps.ssh_access.outputs.sg_id }}
          RUNNER_CIDR: ${{ steps.ssh_access.outputs.runner_cidr }}
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "$SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "$RUNNER_CIDR" || true
