AWSTemplateFormatVersion: '2010-09-09'
Description: Private OpenAlgo EC2 host with SSM access and S3 env file
Parameters:
  EnvBucket:
    Type: String
    Description: Existing private S3 bucket holding openalgo/openalgo.env
  EnvKey:
    Type: String
    Default: openalgo/openalgo.env
  InstanceType:
    Type: String
    Default: t3.small
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: No inbound ports for OpenAlgo
      VpcId: !GetAtt VPC.VpcId
      SecurityGroupIngress: []
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.87.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.87.1.0/24
      MapPublicIpOnLaunch: true
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadEnvOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${EnvBucket}/${EnvKey}
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref LatestAmiId
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref SecurityGroup]
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: openalgo-private
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker awscli curl
          mkdir -p /usr/local/lib/docker/cli-plugins
          curl -fL --retry 3 'https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-x86_64' -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          docker compose version
          systemctl enable --now docker
          mkdir -p /opt/openalgo
          aws s3 cp 's3://${EnvBucket}/${EnvKey}' /opt/openalgo/openalgo.env --region '${AWS::Region}'
          chmod 600 /opt/openalgo/openalgo.env
          cat > /opt/openalgo/compose.yaml <<'COMPOSE'
          services:
            openalgo:
              image: marketcalls/openalgo:latest
              container_name: openalgo-web
              restart: unless-stopped
              ports:
                - "127.0.0.1:5000:5000"
                - "127.0.0.1:8765:8765"
              volumes:
                - openalgo_db:/app/db
                - openalgo_log:/app/log
                - openalgo_strategies:/app/strategies
                - openalgo_keys:/app/keys
                - openalgo_tmp:/app/tmp
                - /opt/openalgo/openalgo.env:/app/openalgo.env:ro
              shm_size: 256m
              environment:
                OPENBLAS_NUM_THREADS: '2'
                OMP_NUM_THREADS: '2'
                MKL_NUM_THREADS: '2'
                NUMBA_NUM_THREADS: '2'
                STRATEGY_MEMORY_LIMIT_MB: '256'
          volumes:
            openalgo_db:
            openalgo_log:
            openalgo_strategies:
            openalgo_keys:
            openalgo_tmp:
          COMPOSE
          cat > /etc/systemd/system/openalgo.service <<'SERVICE'
          [Unit]
          Description=OpenAlgo Docker Compose
          Requires=docker.service
          After=docker.service network-online.target
          Wants=network-online.target
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          WorkingDirectory=/opt/openalgo
          ExecStart=/usr/bin/docker compose up -d
          ExecStop=/usr/bin/docker compose down
          TimeoutStartSec=0
          [Install]
          WantedBy=multi-user.target
          SERVICE
          systemctl daemon-reload
          systemctl enable --now openalgo.service
Outputs:
  InstanceId:
    Value: !Ref Instance
  Region:
    Value: !Ref AWS::Region
